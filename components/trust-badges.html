<!-- Trust Badges Component -->
<!-- Combines all three Golden Gardens trust badges into a single row -->
<!-- Drop this block anywhere inside a page to display the trust badges -->
<div class="gg-badges" role="list" aria-label="Golden Gardens quality badges">

  <!-- Lab Tested -->
  <div class="gg-badge gg-badge--lab-tested" role="listitem">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
      <path fill="#4caf50" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
    </svg>
    <span>Lab Tested</span>
  </div>

  <!-- Discreet Delivery -->
  <div class="gg-badge gg-badge--discreet-delivery" role="listitem">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">

  <!-- High Terpene -->

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false">
      <path fill="#ff9800" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>

    <span>High Terpene</span>

</div>
